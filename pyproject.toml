[project]
name = "astana-walks"
version = "0.1.0"
description = "Astana walking assistant: POI dataset collection (OSM, Wikidata/Wikipedia, Overture Maps)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx[socks]>=0.27",
    "rapidfuzz>=3.9",
    "duckdb>=1.1",
    "opening-hours-py>=2.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
